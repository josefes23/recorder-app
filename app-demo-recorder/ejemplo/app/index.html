<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F7CFF">
<title>Tareitas — app de ejemplo</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--ink:#1b1d29;--mute:#6b7085;--acc:#4F7CFF;--ok:#20b27a;--line:#e6e8f0}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  button,input,select{font:inherit}
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login form{background:var(--card);padding:32px;border-radius:20px;width:min(380px,100%);box-shadow:0 10px 40px #0001}
  .login h1{margin:0 0 4px;font-size:26px}.login p{margin:0 0 20px;color:var(--mute)}
  label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer}
  .btn.full{width:100%;margin-top:20px}
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  aside{background:#fff;border-right:1px solid var(--line);padding:24px 16px}
  .brand{font-weight:800;font-size:20px;margin-bottom:24px;display:flex;gap:8px;align-items:center}
  .dot{width:26px;height:26px;border-radius:8px;background:var(--acc)}
  nav a{display:flex;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;margin-bottom:4px}
  nav a.on{background:#eef2ff;color:var(--acc);font-weight:600}
  main{padding:32px 40px 100px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .top h2{margin:0;font-size:28px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
  .stat{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}
  .stat b{font-size:26px;display:block}.stat span{color:var(--mute);font-size:14px}
  ul{list-style:none;padding:0;margin:0}
  li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
  li .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;color:#fff}
  li.done .chk{background:var(--ok);border-color:var(--ok)}
  li.done .t{text-decoration:line-through;color:var(--mute)}
  .tag{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:99px;background:#eef2ff;color:var(--acc)}
  .modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center}
  .modal.on{display:flex}
  .sheet{background:#fff;width:min(520px,100%);border-radius:22px 22px 0 0;padding:24px 24px 32px;animation:up .25s ease}
  @media(min-width:768px){.modal{align-items:center}.sheet{border-radius:22px}}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .tabbar{display:none}
  .fab{display:none}
  @media(max-width:767px){
    .shell{grid-template-columns:1fr}aside{display:none}
    main{padding:20px 16px 110px}
    .top .btn{display:none}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px}.stat b{font-size:22px}
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0 24px;justify-content:space-around}
    .tabbar a{color:var(--mute);text-decoration:none;font-size:12px;text-align:center}
    .tabbar a.on{color:var(--acc);font-weight:600}
    .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:96px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;border:0;box-shadow:0 8px 20px #4f7cff66}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const state = JSON.parse(localStorage.getItem("tareas") || "null") || [
  { t: "Comprar pan y frutas", tag: "Casa", done: false },
  { t: "Enviar presupuesto a Laura", tag: "Trabajo", done: false },
  { t: "Turno con el dentista", tag: "Salud", done: true },
  { t: "Preparar la reunión del lunes", tag: "Trabajo", done: false },
];
const save = () => localStorage.setItem("tareas", JSON.stringify(state));

function render() {
  const logged = localStorage.getItem("token");
  const route = location.hash.replace("#", "") || "/tareas";
  if (!logged || route === "/login") return renderLogin();
  const pend = state.filter(x => !x.done).length;
  $("#app").innerHTML = `
  <div class="shell">
    <aside><div class="brand"><div class="dot"></div>Tareitas</div>
      <nav><a class="on" href="#/tareas">✓ Tareas</a><a href="#/tareas">◷ Calendario</a><a href="#/tareas">⚙ Ajustes</a></nav></aside>
    <main>
      <div class="top"><h2>Mis tareas</h2><button class="btn" id="nueva">+ Nueva tarea</button></div>
      <div class="stats">
        <div class="stat"><b>${pend}</b><span>Pendientes</span></div>
        <div class="stat"><b>${state.length - pend}</b><span>Hechas</span></div>
        <div class="stat"><b>${Math.round((state.length - pend) / state.length * 100)}%</b><span>Progreso</span></div>
      </div>
      <ul>${state.map((x, i) => `<li class="${x.done ? "done" : ""}" data-i="${i}">
        <div class="chk" role="checkbox" aria-label="Completar ${x.t}">${x.done ? "✓" : ""}</div>
        <span class="t">${x.t}</span><span class="tag">${x.tag}</span></li>`).join("")}</ul>
    </main>
  </div>
  <button class="fab" aria-label="Nueva tarea">+</button>
  <div class="tabbar"><a class="on" href="#/tareas">✓<br>Tareas</a><a href="#/tareas">◷<br>Calendario</a><a href="#/tareas">⚙<br>Ajustes</a></div>
  <div class="modal" id="modal"><form class="sheet" id="f">
    <h3 style="margin:0 0 8px">Nueva tarea</h3>
    <label for="titulo">¿Qué tenés que hacer?</label><input id="titulo" placeholder="Ej: llamar a mamá" autocomplete="off">
    <label for="cat">Categoría</label><select id="cat"><option>Casa</option><option>Trabajo</option><option>Salud</option></select>
    <button class="btn full">Guardar tarea</button></form></div>`;
  const open = () => { $("#modal").classList.add("on"); };
  $("#nueva").onclick = open; $(".fab").onclick = open;
  $("#modal").onclick = e => { if (e.target.id === "modal") e.target.classList.remove("on"); };
  $("#f").onsubmit = e => { e.preventDefault(); const t = $("#titulo").value.trim(); if (!t) return;
    state.unshift({ t, tag: $("#cat").value, done: false }); save(); render(); };
  document.querySelectorAll("li .chk").forEach(c => c.onclick = () => {
    const i = +c.parentElement.dataset.i; state[i].done = !state[i].done; save(); render(); });
}

function renderLogin() {
  $("#app").innerHTML = `<div class="login"><form id="lf">
    <h1>Hola de nuevo 👋</h1><p>Ingresá para ver tus tareas.</p>
    <label for="email">Email</label><input id="email" type="email">
    <label for="pass">Contraseña</label><input id="pass" type="password">
    <button class="btn full">Ingresar</button></form></div>`;
  $("#lf").onsubmit = e => { e.preventDefault();
    if ($("#email").value && $("#pass").value) { localStorage.setItem("token", "demo"); location.hash = "/tareas"; render(); } };
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
