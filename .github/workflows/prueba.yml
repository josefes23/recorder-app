# Graba la app de ejemplo en Windows, Linux y Mac con voz de prueba (sin red)
# y sin música. Si pasa, la instalación y el grabador andan en los tres
# sistemas. Los videos quedan como artefacto del run para mirarlos.
name: Prueba en Windows, Linux y Mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ejemplo:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg   # sin libass: los subtítulos se dibujan con Pillow
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Chromium
        run: uv run playwright install --with-deps chromium

      - name: Grabar la app de ejemplo
        run: uv run grabar.py --config ejemplo/config.py --voz-prueba --sin-musica

      - name: Revisar que salieron los videos (con subtítulos quemados)
        shell: bash
        run: |
          cd salida/ejemplo/crear_tarea
          ls -la
          for f in crear_tarea-mobile-subs.mp4 crear_tarea-desktop-subs.mp4 landing.html; do
            test -s "$f" || { echo "Falta $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ejemplo-${{ matrix.os }}
          path: |
            salida/ejemplo/crear_tarea/*.mp4
            salida/ejemplo/crear_tarea/*.srt
          if-no-files-found: ignore
